<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="reset.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Calistoga&family=IBM+Plex+Sans:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&family=Roboto:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./todo.css" />
    <script type="module" src="./src/main.ts" defer></script>
    <title>Get Things Done</title>
  </head>
  <body>
    <!-- header with catrgory, date, and time -->
    <div id="app">
      <header>
        <h1>Get Things Done!</h1>
        <div class="header-info">
          <div class="surface glass category">
            <p>All To Do</p>
          </div>
          <div class="surface glass date">
            <p id="fullDate"></p>
          </div>
          <div class="surface glass">
            <p id="clock">00:00:00</p>
          </div>
        </div>
      </header>

      <!-- main section, containing the form, and the todo and navbar -->
      <main>
        <div id="todoSection">
          <section>
            <h2 class="visually-hidden">Add a todo</h2>
            <form id="todoForm">
              <label for="newTodo" class="visually-hidden">New todo</label>
              <input
                class="surface"
                id="newTodo"
                name="newTodo"
                value=""
                type="text"
                required
                minlength="4"
                maxlength="255"
                placeholder="Type next task here"
              />
              <button class="surface button" id="addButton" name="add">
                Add
              </button>
            </form>
          </section>
          <section>
            <h2 class="visually-hidden">Your todos</h2>
            <ul id="todoList"></ul>
          </section>
        </div>
        <nav>Hello</nav>
      </main>
    </div>
  </body>
</html>
